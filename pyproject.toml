[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leadforge"
version = "0.2.0"
description = "Stealth business lead scraper with MX verification. Works for any country, any niche."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "beautifulsoup4",
    "pandas",
    "tqdm",
    "playwright>=1.60.0",
    "playwright-stealth",
    "tldextract",
    "lxml",
    "fake-useragent>=1.4.0",
    "dnspython>=2.4.0",
    "curl-cffi>=0.7.0",
    "phonenumbers>=8.13.0",
]

[project.scripts]
leadforge = "leadforge.cli:main"

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[tool.hatch.build.targets.wheel]
packages = ["src/leadforge"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "ruff>=0.15.14",
]
